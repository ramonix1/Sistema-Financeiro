services:
  - type: web
    name: sistema-financeiro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: startCommand: gunicorn "src.main:app" --bind 0.0.0.0:$PORT  # python -m src.main
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: .

